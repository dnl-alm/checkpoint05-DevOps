<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <style>
      .caixa  { fill:#ffffff; stroke:#3b4a5a; stroke-width:1.5; rx:8; }
      .azure  { fill:#e8f3fc; stroke:#0078d4; stroke-width:1.5; }
      .github { fill:#f3f4f6; stroke:#24292f; stroke-width:1.5; }
      .grupo  { fill:none; stroke:#0078d4; stroke-width:1.5; stroke-dasharray:6 4; }
      .titulo { font-size:15px; font-weight:600; fill:#1b2733; }
      .sub    { font-size:12px; fill:#4a5866; }
      .rotulo { font-size:12px; fill:#3b4a5a; font-style:italic; }
      .linha  { fill:none; stroke:#3b4a5a; stroke-width:1.6; marker-end:url(#seta); }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- Fluxo de CI/CD -->
  <rect class="caixa" x="30" y="40" width="160" height="60" rx="8"/>
  <text class="titulo" x="110" y="66" text-anchor="middle">Desenvolvedor</text>
  <text class="sub" x="110" y="85" text-anchor="middle">código + scripts CLI</text>

  <rect class="github" x="250" y="40" width="180" height="60" rx="8"/>
  <text class="titulo" x="340" y="66" text-anchor="middle">GitHub</text>
  <text class="sub" x="340" y="85" text-anchor="middle">checkpoint05-DevOps</text>

  <rect class="github" x="490" y="40" width="180" height="60" rx="8"/>
  <text class="titulo" x="580" y="66" text-anchor="middle">GitHub Actions</text>
  <text class="sub" x="580" y="85" text-anchor="middle">mvn package → deploy</text>

  <path class="linha" d="M190,70 H246"/>
  <text class="rotulo" x="218" y="62" text-anchor="middle">push</text>
  <path class="linha" d="M430,70 H486"/>
  <text class="rotulo" x="458" y="62" text-anchor="middle">gatilho</text>

  <!-- Cliente -->
  <rect class="caixa" x="30" y="300" width="160" height="60" rx="8"/>
  <text class="titulo" x="110" y="326" text-anchor="middle">Cliente</text>
  <text class="sub" x="110" y="345" text-anchor="middle">Postman / navegador</text>

  <!-- Grupo de recursos -->
  <rect class="grupo" x="230" y="150" width="740" height="345" rx="12"/>
  <text class="titulo" x="950" y="175" text-anchor="end" fill="#0078d4">Azure · rg-checkpoint05 · canadacentral</text>

  <!-- App Service Plan + Web App -->
  <rect class="azure" x="260" y="195" width="300" height="160" rx="10" fill-opacity="0.45"/>
  <text class="sub" x="275" y="215">App Service Plan · Linux F1</text>
  <rect class="azure" x="290" y="235" width="240" height="90" rx="8"/>
  <text class="titulo" x="410" y="265" text-anchor="middle">Web App</text>
  <text class="sub" x="410" y="284" text-anchor="middle">library-checkpoint05</text>
  <text class="sub" x="410" y="302" text-anchor="middle">Java 21 · Spring Boot API</text>

  <!-- SQL Server + Database -->
  <rect class="azure" x="640" y="195" width="300" height="160" rx="10" fill-opacity="0.45"/>
  <text class="sub" x="655" y="215">Azure SQL Server "sql-server-checkpoint05"</text>
  <rect class="azure" x="670" y="235" width="240" height="90" rx="8"/>
  <text class="titulo" x="790" y="265" text-anchor="middle">Azure SQL Database</text>
  <text class="sub" x="790" y="284" text-anchor="middle">db-checkpoint05 (Basic)</text>
  <text class="sub" x="790" y="302" text-anchor="middle">t_autor (1) : (N) t_livro</text>

  <!-- Application Insights -->
  <rect class="azure" x="290" y="400" width="240" height="70" rx="8"/>
  <text class="titulo" x="410" y="428" text-anchor="middle">Application Insights</text>
  <text class="sub" x="410" y="447" text-anchor="middle">ai-checkpoint05</text>

  <!-- Conexões -->
  <path class="linha" d="M580,100 V135 H500 V231"/>
  <text class="rotulo" x="588" y="128">deploy do .jar</text>

  <path class="linha" d="M190,330 H240 V280 H286"/>
  <text class="rotulo" x="245" y="312">HTTPS</text>

  <path class="linha" d="M530,280 H666"/>
  <text class="rotulo" x="598" y="272" text-anchor="middle">JDBC :1433</text>

  <path class="linha" d="M410,325 V396"/>
  <text class="rotulo" x="418" y="370">telemetria</text>
</svg>
